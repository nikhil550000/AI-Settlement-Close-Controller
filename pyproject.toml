[project]
name = "settlement-close-controller"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "typer>=0.27.1",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0.0",
    "openai>=1.60.0",
    "jinja2>=3.1.6",
]

[project.scripts]
generate = "generator.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator", "pipeline"]
